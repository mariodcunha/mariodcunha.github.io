<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Big Art Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<style>
:root{
  --land:#F3F4EF; --water:#C5D6DB; --park:#D9E5CF;
  --pin:#2B4FE0; --trail:#9EA5AC; --label:#8E979F;
  --ink:#1B1F24; --muted:#5B6570; --paper:#FDFDFA;
  --shadow:0 18px 40px rgba(20,40,60,.22), 0 3px 8px rgba(20,40,60,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--land);color:var(--ink);overflow-x:hidden;
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-map,.maplibregl-ctrl-attrib{font-family:inherit}
.maplibregl-ctrl-attrib{font-size:10px}

/* map labels, drawn as page text so they can use the same typeface as everything else */
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;color:#8E979F;letter-spacing:.01em;
  text-shadow:0 0 2px var(--land),0 0 2px var(--land),0 0 3px var(--land);will-change:transform;animation:lblIn .25s ease-out}
.lbl.water{color:#8FA7AF;text-shadow:0 0 2px var(--water),0 0 3px var(--water)}
.lbl.sf{color:var(--ink);opacity:.85;font-weight:800;letter-spacing:-.01em;z-index:1;animation:none}
@keyframes lblIn{from{opacity:0}}

.pin{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:3;
  border-radius:50%;background:var(--pin);border:3px solid var(--paper);
  box-shadow:0 2px 6px rgba(0,0,0,.25);will-change:transform;pointer-events:none;transition:background .3s}
.pin.upcoming{background:var(--paper);border-color:var(--pin)}

header{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 14px;
  display:flex;justify-content:space-between;align-items:baseline;
  background:linear-gradient(var(--land) 20%, rgba(243,244,239,0))}
h1{margin:0;font-weight:800;font-size:clamp(1.25rem,2.6vw,1.6rem);letter-spacing:-.02em;line-height:1}
.count{font-weight:600;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}

.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:5;
  text-align:center;font-size:1rem;color:var(--muted);pointer-events:none}
.hint span{background:rgba(243,244,239,.85);padding:4px 10px;border-radius:999px}
.hint svg{display:block;margin:8px auto 0;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}

.polaroid{position:absolute;left:50%;top:0;margin:0;z-index:4;
  width:min(340px,76vw,calc(76svh - 200px));
  background:var(--paper);padding:12px 12px 16px;border-radius:3px;box-shadow:var(--shadow);
  transform-origin:50% 100%;opacity:0;visibility:hidden;will-change:transform,opacity}
.polaroid .photo{aspect-ratio:1/1;width:100%;overflow:hidden;background:#dde3e6;display:block}
.polaroid .photo img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .blank{width:100%;height:100%;background:#E4E8E9}
.polaroid h2{margin:14px 2px 2px;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.polaroid h2 a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:baseline;
  white-space:nowrap;max-width:100%;overflow:hidden;cursor:pointer}
.polaroid h2 a > span:first-child{overflow:hidden;text-overflow:ellipsis;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:rgba(27,31,36,.4)}
.polaroid h2 a:hover > span:first-child{text-decoration-color:var(--pin)}
.polaroid h2 a:focus-visible{outline:2px solid var(--pin);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#track{position:relative;pointer-events:none}   /* only there to make the page scrollable; clicks pass through to the Polaroids */
#notice{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9;display:none;
  max-width:520px;margin:0 auto;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);font-size:.95rem;line-height:1.4}
#notice code{font-size:.85em;word-break:break-word;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.hint svg{animation:none}}

/* ---------- Art drawer: right-side panel on wide screens, bottom sheet on phones ---------- */
html.drawer-open{overflow:hidden}   /* page scroll drives the map, so freeze it while reading */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(16,22,28,.28);opacity:0;visibility:hidden;
  transition:opacity .3s ease,visibility 0s linear .3s}
#drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(460px,100vw);display:flex;flex-direction:column;
  background:var(--paper);box-shadow:-18px 0 50px rgba(20,40,60,.22);transform:translateX(102%);visibility:hidden;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s}
html.drawer-open #scrim{opacity:1;visibility:visible;transition:opacity .3s ease}
html.drawer-open #drawer{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.dr-bar{flex:none;display:flex;justify-content:flex-end;align-items:center;padding:14px 14px 0;position:relative}
.dr-grab{display:none}
.dr-x{width:40px;height:40px;border-radius:50%;border:0;background:#EDEFEC;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.dr-x:hover{background:#E2E5E1}
.dr-x svg{width:18px;height:18px}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:4px 28px 36px}
.dr-status{display:inline-block;margin:0 0 12px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;
  letter-spacing:.02em;color:var(--pin);background:#E8EDFD}
#dr-title{margin:0;font-size:clamp(1.6rem,4.2vw,2rem);font-weight:800;line-height:1.08;letter-spacing:-.025em}
.dr-artist{margin:8px 0 0;font-size:1.02rem;color:var(--muted);line-height:1.4}
.dr-photo{margin:20px 0 0}
.dr-photo .frame{aspect-ratio:4/3;background:#E4E8E9;overflow:hidden;border-radius:6px}
.dr-photo img{width:100%;height:100%;object-fit:cover;display:block}
.dr-photo figcaption{margin-top:6px;font-size:.78rem;color:var(--muted);line-height:1.35}
.dr-note{margin:18px 0 0;padding:10px 12px;border-radius:8px;background:#FFF4D6;font-size:.92rem;line-height:1.45}
.dr-body h3{margin:24px 0 8px;font-size:.78rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dr-about{margin:0;font-size:1.02rem;line-height:1.6}
.dr-facts{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:.95rem;line-height:1.45}
.dr-facts dt{color:var(--muted)}
.dr-facts dd{margin:0}
.dr-body a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:rgba(27,31,36,.35)}
.dr-body a:hover{text-decoration-color:var(--pin)}
.dr-links a{margin-right:14px;white-space:nowrap}
.dr-more{display:inline-block;margin-top:14px;font-weight:600}
.dr-foot{flex:none;position:relative;padding:10px 28px calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--paper)}
.dr-foot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:56px;pointer-events:none;
  background:linear-gradient(rgba(253,253,250,0),rgba(253,253,250,.85) 60%,var(--paper))}   /* text fades out as it rolls under the button */
.dr-back{display:block;width:100%;margin:0;padding:14px;border-radius:12px;border:1.5px solid #D5D9D4;background:var(--paper);
  font:inherit;font-weight:600;font-size:1rem;color:var(--ink);cursor:pointer}
.dr-back:hover{background:#F1F2EE}
.dr-x:focus-visible,.dr-back:focus-visible,.dr-body a:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
@media (max-width:767px){
  #drawer{top:calc(env(safe-area-inset-top,0px) + 28px);left:0;width:auto;border-radius:18px 18px 0 0;
    box-shadow:0 -12px 40px rgba(20,40,60,.25);transform:translateY(102%)}
  .dr-bar{justify-content:center;padding:8px 12px 0}
  .dr-grab{display:block;width:40px;height:5px;border-radius:3px;background:#D5D9D4;margin:4px 0 6px}
  .dr-x{position:absolute;right:12px;top:10px}
  .dr-body{padding:14px 20px 32px}
  .dr-foot{padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 14px)}
}
@media (prefers-reduced-motion: reduce){#drawer,#scrim{transition:none !important}}
</style>
</head>
<body>
<div id="stage">
  <div id="map" aria-label="Map of San Francisco showing the art I've visited"></div>
  <div id="labels"></div>
  <div id="pins"></div>
  <div id="cards"></div>
</div>

<header>
  <h1>My Big Art Loop</h1>
  <span class="count" id="count" aria-live="polite"></span>
</header>

<div class="hint" id="hint"><span>Scroll to follow the loop</span>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</div>

<div id="track"></div>
<div id="notice" role="alert"></div>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
  <div class="dr-bar">
    <span class="dr-grab" aria-hidden="true"></span>
    <button class="dr-x" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dr-body">
    <p class="dr-status">On display now</p>
    <h2 id="dr-title"></h2>
    <p class="dr-artist"></p>
    <figure class="dr-photo"><div class="frame"><img alt=""></div><figcaption></figcaption></figure>
    <p class="dr-note"></p>
    <h3>About the piece</h3>
    <p class="dr-about"></p>
    <h3>Details</h3>
    <dl class="dr-facts"></dl>
    <a class="dr-more" target="_blank" rel="noopener">Read more on bigartloop.org</a>
  </div>
  <div class="dr-foot"><button class="dr-back" type="button">Go back</button></div>
</aside>

<script>
// Show a readable message instead of a silent blank page if something fails
function showNotice(msg, detail){
  const n=document.getElementById("notice");
  n.innerHTML=msg+(detail?`<br><code>${String(detail).slice(0,240)}</code>`:"");
  n.style.display="block";
}
window.addEventListener("error", e => showNotice("The map couldn't start here. Open this file directly in Chrome, Safari or Firefox, or from your hosted link.", e.message));
</script>
<script>
if (!window.maplibregl) showNotice("The map library didn't load. Check your internet connection, or turn off any content blocker for this page.");
/* =====================================================================

// Details for the drawer, from each piece's official page on bigartloop.org
// (facts and photo; "about" is a short summary written for this site). Keyed by the stop's url.
const ART = {
  "https://www.bigartloop.org/reuben-rude-wordplay-kind": {"title": "WordPlay: KiND", "artist": "Reuben Rude, with fabricators Gregory Blum and Oliver Wilson", "location": "Golden Gate Park, JFK Promenade & 8th Ave", "partners": "Sijbrandij Foundation, Building 180, Illuminate the Arts, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/bb96f038-ef72-44d5-906e-b40b03358f54/WordPlay_+KiND+by+%40reubenrude+2_Photo+Credit+%40iromo_.jpeg?format=1000w", "credit": "Masaki Omori; Reuben Rude", "links": [["Website", "https://reubenrude.bigcartel.com"], ["Instagram", "https://www.instagram.com/reubenrude/?hl=en"]], "about": "One of two WordPlay sculptures Reuben Rude made with Illuminate for the Golden Mile. The letters spell KiND with the “i” left out, so the word is only finished when someone stands in the gap. It’s built from reclaimed wood, microcement and concrete, painted in many layers to look weathered but cheerful."},
  "https://www.bigartloop.org/reuben-rude-wordplay-smile": {"title": "WordPlay: SMiLE", "artist": "Reuben Rude, with fabricators Gregory Blum and Oliver Wilson", "location": "Golden Gate Park, JFK Promenade & 8th Ave", "partners": "Sijbrandij Foundation, Building 180, Illuminate the Arts, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/9d8e8acb-6365-4473-b37a-2c1f732d9da5/WordPlay_+SMiLE+by+%40reubenrude+1_Photo+Credit+%40iromo_.jpeg?format=1000w", "credit": "Masaki Omori; Reuben Rude", "links": [["Website", "https://reubenrude.bigcartel.com"], ["Instagram", "https://www.instagram.com/reubenrude/?hl=en"]], "about": "The twin of KiND, a few steps along JFK Promenade. SMiLE is also missing its “i”: step into the gap and you complete the word. Like KiND, it’s reclaimed wood, microcement and concrete, layered with paint and stain for a sun-faded look."},
  "https://www.bigartloop.org/mark-deem-wheres-the-ball-the-jax": {"title": "Where’s the Ball? (The Jax)", "artist": "Mark Deem (lead artist) and Kevin Byall (co-designer and fabricator), Misfit Toys", "location": "In front of the Conservatory of Flowers - Golden Gate Park, San Francisco, CA", "partners": "Building 180, San Francisco Recreation and Parks Department, Illuminate the Arts", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/11eb902b-e773-47db-9821-a2a05fd0f4ad/Wheres-the-ball-jax-photoby-misfit-toys.jpeg?format=1000w", "credit": "Masaki Omori; Misfit Toys", "links": [["Website", "https://misfittoys.art/"], ["Instagram", "https://www.instagram.com/misfittoyscrew/"]], "about": "A classic toy jack, blown up about 85 times in steel and scattered across the lawn in front of the Conservatory of Flowers. The pieces are low enough to sit on and wide enough to crawl under. Mark Deem got the idea after finding an antique jack inside the wall of a 1930s cottage. The title is the old joke that the ball is always the first thing you lose."},
  "https://www.bigartloop.org/traces-in-order-to-remember-le-retour-des-soleis": {"title": "Traces in Order to Remember + Le Retour des Soleils", "artist": "Betsabeé Romero", "location": "On JFK Drive as part of the Golden Mile in Golden Gate Park in San Francisco. On JFK Drive and Conservatory Drive East", "installed": "August 2025", "partners": "San Francisco Recreation & Parks Department, Sijbrandij Foundation, Building 180, Illuminate", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/da3fdbac-a265-42ea-bacb-4d6e8146b8fa/_J1A5514.jpg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.betsabeeromero.com/"], ["Instagram", "https://www.instagram.com/betsabee_romero/"]], "about": "A group of large sculptures by Mexican artist Betsabeé Romero near the east end of JFK Promenade. Romero transforms everyday industrial objects, like car tires and car parts, with carved and gilded patterns drawn from Indigenous and traditional Mexican art. Her work touches on migration, movement and memory.", "note": "Being refurbished (as of July 2026) and set to return to the Golden Mile."},
  "https://www.bigartloop.org/kate-raudenbush-seed-of-self": {"title": "Seed of Self", "artist": "Kate Raudenbush", "location": "The Panhandle West Entry, San Francisco, CA", "installed": "May 2026", "partners": "Building 180, SF Rec & Park", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/6289332b-4a2a-406e-99a7-7d8a5a2aee00/Seed+of+Self+by+Kate+Raudenbush+Photo+Credit+Masaki+Omori+%40iromo_11.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["KateRaudenbush.com", "https://www.kateraudenbush.com/"], ["Incantoexhibit.com", "https://www.incantoexhibit.com/"], ["Instagram", "https://www.instagram.com/kateraudenbush/"]], "about": "A giant seed split into two halves at the Panhandle’s west entrance. The “past” half wraps a mirrored sphere in a laser-cut brass mandala; the “future” half is an open, unfinished frame. A wooden bench sits between them, so you literally sit in the present. At night the seed glows from within."},
  "https://www.bigartloop.org/jack-champion-an-attempted-murder": {"title": "An Attempted Murder", "artist": "Jack Champion", "location": "The Panhandle, San Francisco, CA", "installed": "May 2026", "partners": "Building 180, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/d6e683c3-3ee0-4830-89ab-65949daa7d6c/Attempted+Murder+by+Jack+Champion_Photo+Credit+Masaki+Omori+%40iromo_5.jpeg?format=1000w", "credit": "Masaki Omori; Jeff Song and Mark Rightmire", "links": [["Instagram", "https://www.instagram.com/jackchampionart/"]], "about": "Two giant crows, Tom and Lucinda, face off in the Panhandle, where real crows gather. Their posture reads like an argument, but they’re still facing each other. It’s a funny, slightly uneasy picture of staying in conversation through conflict, and the title plays on “a murder of crows.”"},
  "https://www.bigartloop.org/griffin-loop-launch-intention": {"title": "Launch Intention", "artist": "Griffin Loop", "location": "Marina Green Triangle San Francisco, CA", "partners": "Building 180, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/0bd5fc9c-8378-4e53-8269-e809f36ab9bf/Launch+Intention+by+Griffin+Loop_Photo+Credit+Masaki+Omori+%40iromo_2.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://launchintention.com/"], ["Instagram", "https://www.instagram.com/griffinloop/"]], "about": "A monumental paper airplane on the Marina Green, under skies full of birds and Fleet Week jets. Griffin Loop turns a childhood toy into a quiet question: what are you ready to launch?"},
  "https://www.bigartloop.org/desert-shark": {"title": "Desert Shark", "artist": "Peter Hazel", "location": "Port of San Francisco at Pier 45 Plaza", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/c1218342-1010-44c7-93ec-71d26cb6838b/Desert+Shark_Masaki_J1A3551_min.jpg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.peterhazel.com"], ["Instagram", "https://www.instagram.com/peterhazelart"]], "about": "A big, playful shark covered in hand-laid tile mosaic over a steel frame, by Nevada artist Peter Hazel. It first appeared at Burning Man and now sits at Pier 45 near Fisherman’s Wharf, a nod to the neighborhood’s fishing history."},
  "https://www.bigartloop.org/pulse-portal": {"title": "Pulse Portal", "artist": "Davis McCarty", "location": "Port of San Francisco at Pier 27 Cruise Terminal Sidewalk", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/10b2e7ad-911f-4d28-abd1-e18f5f684fc9/Pulse-Portal-Davis-McCarty-photo-masaki-omori-6.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.davismccarty.com/"], ["Instagram", "https://www.instagram.com/dicrodavis"]], "about": "A 20-foot archway of dichroic plexiglass by Davis McCarty that splits and shifts light as you walk through it. It stands outside the Pier 27 cruise terminal, a gateway for people arriving in the city. It has also been shown at Burning Man and AREA15 in Las Vegas."},
  "https://www.bigartloop.org/got-framed": {"title": "Got Framed", "artist": "El NiNo", "location": "Port of San Francisco at Pier 7", "installed": "October 2025", "partners": "Sijbrandij Foundation, Building 180, San Francisco Port", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/f7b00dba-3ac8-41e4-9df1-b3c255e80aa4/Got+Framed_Masaki_J1A4040-HDR_min.jpg?format=1000w", "credit": "Masaki Omori; Stephane Lanoux, Victor Goodpasture, Kerry Lee Young, Jess Bernstein, DJ Pierce", "links": [["Website", "https://www.leaveittonino.com"], ["Artist Instagram", "https://www.instagram.com/leaveittonino/"], ["Project Instagram", "https://www.instagram.com/got_framed/"]], "about": "A 12-foot golden picture frame by Puerto Rican artist El NiNo. Step inside and you become the artwork, with the waterfront behind you. Its message: “I AM A MASTERPIECE.” It debuted at Burning Man and toured California before landing at Pier 7."},
  "https://www.bigartloop.org/coralee": {"title": "Coralee", "artist": "Dana Albany", "location": "Port of San Francisco at Pier ½", "installed": "September 2025", "partners": "Sijbrandij Foundation, Building 180, SF Port", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/000c3e91-2a60-4ea9-a1ba-a256146eec1f/Coralee+by+Dana+Albany+1_Photo+Credit+%40iromo_.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.danaalbanyart.com/"], ["Instagram", "https://www.instagram.com/danaalbany/?hl=en"]], "about": "An 18-foot reclining mermaid by Dana Albany, built from steel and reclaimed materials, at Pier ½ with the Bay Bridge behind her. She’s a reminder of how beautiful and fragile ocean life is. Coralee was shown in England and on Mare Island before coming here."},
  "https://www.bigartloop.org/r-evolution": {"title": "R-Evolution", "artist": "Marco Cochrane", "location": "On display at Embarcadero Plaza in San Francisco. Near the intersection of Market and Steuart Streets", "installed": "April 2025", "partners": "San Francisco Recreation & Parks Department, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/c3d45119-f72d-459b-b1dc-e879112f0a56/_J1A4771.png?format=1000w", "credit": "Masaki Omori, Messiah Foster, Lisa Vortman", "links": [["Instagram", "https://www.instagram.com/marcocochrane/#"], ["Building 180", "https://building180.com/r-evolution"]], "about": "Marco Cochrane’s towering figure of a woman at Embarcadero Plaza, facing Market Street and the Ferry Building. It stands for strength, unity and personal autonomy, and lights up at night.", "note": "Leaving soon: a free farewell celebration is planned at Embarcadero Plaza on October 2, 2026, 5:30–8 PM."},
  "https://www.bigartloop.org/echoes-a-voice-from-uncharted-waters": {"title": "Echoes – A voice from uncharted waters", "artist": "Mathias Gmachl", "location": "Port of San Francisco at WETA Plaza", "installed": "November 2025", "partners": "Sijbrandij Foundation, Building 180, San Francisco Port", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/b4bf8358-c13e-4f82-bcfd-a3e2db777fbf/Echoes_Masaki_J1A4136_Front_min.jpg?format=1000w", "credit": "Masaki Omori; Alexandre Ayer", "links": [["Website", "https://loop.ph/mathias-gmachl/"], ["Instagram", "https://www.instagram.com/mathiasgmachl/"]], "about": "A life-size blue whale calf, one year old, built from slats and surrounded by sound. Walk too close and an alarm goes off, followed by silence: a gentle hint at our impact on the natural world."},
  "https://www.bigartloop.org/corpus": {"title": "Corpus", "artist": "Michael Christian", "location": "Port of San Francisco at Pier 14", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/3b7268e3-25dd-43cd-ae86-c734f41ec5ab/Corpus_Masaki_J1A4149_min.jpg?format=1000w", "credit": "Masaki Omori", "links": [["Instagram", "https://www.instagram.com/michaelchristianart"]], "about": "An abstract steel form by Michael Christian that seems to rise out of the sea, made from salvaged and raw steel through an improvised process. The title means “body” (a person’s, a community’s, or a lifetime of experience), and the rest is left to your imagination."},
  "https://www.bigartloop.org/giuseppe-palumbo-hope-peace": {"title": "Hope/Peace", "artist": "Giuseppe Palumbo", "location": "Pier 28, San Francisco, CA", "installed": "September 2026", "partners": "Port of San Francisco, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/db6815cb-220e-47c2-b9b5-dc285c42374d/Hope-Peace-by-Giuseppe-Palumbo-B180-2.jpeg?format=1000w", "credit": "Building 180", "links": [["Website", "https://www.gallerygiuseppe.com/"], ["Instagram", "https://www.instagram.com/gallery_giuseppe/"]], "about": "Two sculpted hands by Berkeley artist Giuseppe Palumbo: one flashes a peace sign, the other crosses its fingers for hope. Shaped by hand rather than by computer, the gestures need no translation."},
  "https://www.bigartloop.org/atabeys-treasure": {"title": "Atabey’s Treasure", "artist": "El NiNo", "location": "Port of San Francisco at Brannan St. Wharf", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/c810f484-a8e4-4bdd-978b-892d2414a712/Attabey_Masaki__J1A4261-min.jpg?format=1000w", "credit": "Masaki Omori; Mattias Löw, EspressoBuzz, Brandon Driscoll-Lutttringer, George Krieger", "links": [["Website", "https://www.leaveittonino.com"], ["Project Instagram", "https://www.instagram.com/atabeystreasure"], ["Artist Instagram", "https://www.instagram.com/leaveittonino"]], "about": "A fish leaping out of the earth, made from steel and recycled pizza pans by El NiNo. It honors Atabey, the Taíno goddess of fresh water and life, and is dedicated to Puerto Rico, still recovering from hurricanes, earthquakes and blackouts."},
  "https://www.bigartloop.org/fnnch-lips": {"title": "LIPS", "artist": "fnnch", "location": "South Beach Marina, San Francisco, CA", "installed": "July 2026", "partners": "Port of SF, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/8e885e12-9c72-4894-a567-fc088496927f/Lips-by-fnnch-photo-by-lana-shapoval-4.jpeg?format=1000w", "credit": "Lana Shapoval", "links": [["Website", "https://fnnch.com/"], ["Instagram", "https://www.instagram.com/fnnch"]], "about": "A bold pair of red lips in fnnch’s pop style at South Beach Marina, near Oracle Park. Simple and instantly recognizable, it asks what we’re saying, what we’re hearing, and how we show up in public."},
  "https://www.bigartloop.org/steelhead": {"title": "Steelhead", "artist": "Bryan Tedrick", "location": "Port of San Francisco at Pier 52 Boat Launch", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/9ead7e68-7de8-4c4f-822b-a7b7f0de4107/Steelhead__Masaki_J1A4244_min.jpg?format=1000w", "credit": "Masaki Omori; Terry Roberts", "links": [["Website", "https://www.bryantedrick.com/"], ["Instagram", "https://www.instagram.com/bryantedrickart"]], "about": "A steelhead trout made from a twisted steel beam rescued from the 2019 fire that destroyed Soda Rock Winery near Healdsburg. Bryan Tedrick added a head, tail and details in steel and stainless steel, a tribute to the native fish of the Russian River."},
  "https://www.bigartloop.org/louis": {"title": "Louis", "artist": "DeWitt Godfrey", "location": "Port of San Francisco at Bayfront Park", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/ac300334-3e08-45d8-b6af-d50fe55537da/Louis-dewitt-godfrey-photo-by-masaki-omori-3.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.dewittgodfrey.com/"], ["Instagram", "https://www.instagram.com/dewittgodfreystudio"]], "about": "A hive-like dome of stacked steel ovals by DeWitt Godfrey, inspired by shells and honeycombs. Walk inside and look up through an opening to the sky. It was first built in 2016 for ArtPrize in Grand Rapids, Michigan, where it won an award, and is named after one of that city’s early settlers, Louis Campau."},
  "https://www.bigartloop.org/dr-fisherians-runaway-machine": {"title": "Dr. Fisherian's Runaway Machine", "artist": "Chris Wollard and Kevin Conran", "location": "Port of San Francisco at Crane Cove Park", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/f18a11e3-0909-45ea-b983-e21b32fad635/Dr.+Fisherian%27s+Runaway+Machine_Day.jpeg?format=1000w", "links": [["Instagram", "https://www.instagram.com/chris_wollard"]], "about": "A bright red walking machine caught mid-stride, by Chris Wollard, standing out against the open waterfront at Crane Cove Park. Half industrial, half imaginary, it leaves you to invent where it came from and where it’s going."},
  "https://www.bigartloop.org/bloom": {"title": "Bloom", "artist": "Michael Christian", "location": "Port of San Francisco at Heron's Head Park", "installed": "October 2025", "partners": "San Francisco Port, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/1699ed77-5a7a-4f4e-a828-3752419f3580/Bloom_Masaki_DJI_0829-HDR.jpg?format=1000w", "links": [["Website", "https://www.michaelchristian.com/"], ["Instagram", "https://www.instagram.com/michaelchristianart"]], "about": "An otherworldly steel flower by Michael Christian at Heron’s Head Park on the southeastern waterfront. Like his piece Corpus, it was made for festival crowds in the desert, and it’s meant to be walked around, looked up at and explored from every side.", "credit": "Masaki Omori"},
  "https://www.bigartloop.org/zulu-heru-whispers-of-waste": {"title": "Whispers of Waste", "artist": "Zulu Heru", "location": "India Basin Waterfront Park - 900 Innes Ave, San Francisco, CA 94124", "installed": "March 2026", "partners": "Building 180, Sijbrandij Foundation, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/0176d825-82e7-475d-ac3d-791ea8e1ef53/Whispers+of+Waste_J1A9505+%281%29.jpg?format=1000w", "credit": "Masaki Omori; additional photos by Max Kapczynski", "links": [["Website", "https://zuluheru.com/"], ["Instagram", "https://www.instagram.com/zulu.heru/?hl=en"]], "about": "A 13-foot guardian figure of reclaimed scrap metal and stone by Zulu Heru, inspired by the mask traditions of the Senufo people of Côte d’Ivoire. At India Basin, its recycled materials nod to the shoreline’s industrial past and its renewal."},
  "https://www.bigartloop.org/octavius": {"title": "Octavius", "artist": "Peter Hazel", "location": "Sunset Dunes in San Francisco, near the intersection of Great Highway & Sloat Boulevard", "installed": "April 2025", "partners": "San Francisco Recreation & Parks Department, Friends of Sunset Dunes, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/5852e7e8-a98b-4094-86e1-4c96c5f4f6cf/Octavius+by+Peter+Hazel+2_Photo+Credit+%40iromo_.jpeg?format=1000w", "credit": "Masaki Omori; Jack Persons", "links": [["Instagram", "https://www.instagram.com/peterhazelart/"]], "about": "A 30-foot-long octopus by Peter Hazel, covered in thousands of handmade, high-fired ceramic mosaic tiles, with fused-glass suckers and eyes. Hazel grew up in Half Moon Bay and was inspired by Gaudí’s tile work in Barcelona."},
  "https://www.bigartloop.org/rock-spinner": {"title": "Rock Spinner", "artist": "Zack Coffin", "location": "Sunset Dunes in San Francisco, near the intersection of Great Highway & Lawton Street", "installed": "April 2025", "partners": "San Francisco Recreation & Parks Department, Friends of Sunset Dunes, Sijbrandij Foundation, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/fbbacbf6-cca4-4ca7-b56d-663542a09c59/Rock+Spinner+by+Zack+Coffin+5_Photo+Credit+%40iromo_.jpeg?format=1000w", "credit": "Masaki Omori, Jack Persons and Max Elman", "links": [["Website", "https://zacharycoffin.com/work/rockspinner-2001/"], ["Instagram", "https://www.instagram.com/zacharycoffinart/"]], "about": "A 10-ton boulder balanced on a bearing, so a single person can spin it by hand. Zack Coffin’s sculpture plays with weight and permanence: something that should never move turns at a push."},
  "https://www.bigartloop.org/oleg-lobykin-unsafe-to-swim": {"title": "Unsafe to Swim", "artist": "Oleg Lobykin", "location": "Lincoln Entrance SW, Golden Gate Park, San Francisco, CA", "installed": "July 2026", "partners": "San Francisco Recreation and Parks Department, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/9d48ac22-71d0-4e1a-9572-c1f1446e4576/Unsafe+to+Swim+by+Oleg+Lobykin+9_Photo+Credit+%40iromo_.jpg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.lobykin.com/"]], "about": "A giant dorsal fin by Oleg Lobykin near the ocean end of Golden Gate Park. From afar it reads as danger. Up close, it’s covered in recycled aluminum cans, pointing to the real threat facing the ocean."},
  "https://www.bigartloop.org/miki-iwasaki-marine-layer": {"title": "Marine Layer", "artist": "Miki Iwasaki", "location": "Across from Metson Lake, Golden Gate Park, San Francisco, CA", "installed": "August 2026", "partners": "San Francisco Recreation and Parks Department, Building 180", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/18c9dbfd-c43f-4d0e-94e5-a1882f703792/Marine-layer-miki-iwasaki-photo-by-masaki-omori-5.jpeg?format=1000w", "credit": "Masaki Omori", "links": [["Website", "https://www.mikiiwasaki.com/"], ["Instagram", "https://www.instagram.com/miki_iwasaki/"]], "about": "A perforated corten steel sculpture by Miki Iwasaki across from Metson Lake. Light, sky and water show through its surface, so it changes with the weather, like the fog it’s named after."},
  "https://www.bigartloop.org/naga": {"title": "Naga", "artist": "Cjay Roughgarden, Stephanie Shipman, and Jacquelyn Scott", "location": "On JFK Drive near Crossover Drive", "installed": "July 2025", "partners": "Sijbrandij Foundation, Building 180, Illuminate, Coven, San Francisco Recreation & Parks Department", "photo": "https://images.squarespace-cdn.com/content/v1/6890f8681136e63fbedfce79/cbcd617e-9116-4bfc-9faf-f156a78af109/_J1A5613.jpg?format=1000w", "credit": "Masaki Omori, Elton Hom, Marcus Aureliuz, Urvashi", "links": [["Website", "https://www.nagaandthecaptainess.com/"], ["Instagram", "https://www.instagram.com/naga_and_the_captainess/"]], "about": "A 100-foot sea serpent in Rainbow Falls Pond on JFK Promenade, first shown at Burning Man 2024. It has over 5,000 hand-forged iridescent scales, glows at night and sometimes blows bubbles. More than 250 volunteers helped build it."}
};

// point (and how many vertices it has passed) a fraction q of the way along a leg
function along(leg, q){
  const d = q * leg.len; let k = 1;
  while (k < leg.cum.length-1 && leg.cum[k] < d) k++;
  const seg = (leg.cum[k]-leg.cum[k-1]) || 1e-30, f = clamp((d-leg.cum[k-1]) / seg);
  const a = leg.path[k-1], b = leg.path[k];
  return {k, pt: [lerp(a[0],b[0],f), lerp(a[1],b[1],f)]};
}

const P = STOPS.map(s => merc(s.lngLat));
const LEGS = P.slice(1).map((b,i) => legPath(P[i], b));
const LEG_M = 40075016 * Math.cos(37.77*Math.PI/180);    // mercator units -> metres here

// overview: the whole loop and every piece
const [OV_A, OV_B] = bbox(RV.concat(P));
const SF_C = [(OV_A[0]+OV_B[0])/2, (OV_A[1]+OV_B[1])/2];
const Z0 = () => fitZoom(OV_A, OV_B, 0.86);

/* ---------- Timeline (in screen-heights of scroll) ---------- */
// longer walks get a bit more scroll, so the map never races
const flyFor = leg => clamp(0.8 + 0.45*Math.log2(1 + leg.len*LEG_M/1000), 0.8, 3.2);
const holds = [];
let u = 0;
STOPS.forEach((s,i) => { u += i ? flyFor(LEGS[i-1]) : FLY; holds.push([u, u+HOLD]); u += HOLD; });
const LAST = u;               // leaving the last piece
const TOTAL = u + OUT;        // whole loop drawn, back on the overview
const RESET = TOTAL + 0.5;    // pause on the finished loop, then fade the trail and pins back
const LOOP  = RESET + 0.5;    // looks exactly like the start, so scrolling on wraps to the top

function inView(pt, cam){
  const [x,y] = toScreen(pt, cam), m = 40;
  return x > m && x < W-m && y > 90 && y < H-m;
}
const fyOf = z => 0.5 + (FOCUS_Y-0.5)*clamp((z-Z0())/(Z_STOP-Z0()));

// screen position of a mercator point for a given camera {c, z}
const toScreen = (pt, cam) => [W/2 + (pt[0]-cam.c[0])*ws(cam.z), H/2 + (pt[1]-cam.c[1])*ws(cam.z)];
// camera that puts pt at screen position sp at zoom z
const camAt = (pt, sp, z) => ({ z, c:[pt[0] - (sp[0]-W/2)/ws(z), pt[1] - (sp[1]-H/2)/ws(z)] });
const camOf = (pt, z) => camAt(pt, [W/2, H*fyOf(z)], z);

function camera(t){
  const n = STOPS.length;
  // First dive: zoom toward the first piece from the very first scroll
  if (t < holds[0][0]) return anchored(P[0], camOf(SF_C,Z0()), camOf(P[0],Z_STOP), clamp(t/holds[0][0]), outBack, outCubic);
  for (let i=0;i<n;i++){
    const [h0,h1] = holds[i];
    if (t <= h1) return camOf(P[i], Z_STOP);
    if (i < n-1 && t < holds[i+1][0]) return travel(LEGS[i], P[i+1], (t-h1)/(holds[i+1][0]-h1));
  }
  // Final pull-back from the last piece to the whole loop
  if (t < TOTAL) return anchored(P[n-1], camOf(P[n-1],Z_STOP), camOf(SF_C,Z0()), clamp((t-LAST)/OUT), inOut, inOut);
  return camOf(SF_C, Z0());
}
// Follow the walking route. If the next piece is already on screen, stay at the same zoom;
// otherwise zoom out just enough to keep the whole walk in view, then zoom back in.
function travel(leg, next, p){
  const q = inOut(p), pt = along(leg, q).pt;
  const zFar = fitZoom(leg.bbA, leg.bbB, 0.45);
  // next piece on screen, or only a short walk away: no zoom change at all
  if (inView(next, camOf(leg.path[0], Z_STOP)) || zFar > Z_STOP-0.5) return camOf(pt, Z_STOP);
  // zoom out while setting off, stay out for the middle of the walk, zoom in on arrival with a slight overshoot
  const z = p < 0.3 ? lerp(Z_STOP, zFar, inOut(p/0.3))
          : p < 0.7 ? zFar
          : lerp(zFar, Z_STOP, inOut((p-0.7)/0.3)) + 0.25*Math.sin(Math.PI*clamp((p-0.82)/0.18));
  return camOf(pt, z);
}
// keep anchor point gliding from where it is on screen to its target spot while zooming
function anchored(pt, A, B, p, zE, pE){
  const sa=toScreen(pt,A), sb=toScreen(pt,B), q=pE(p);
  return camAt(pt, [lerp(sa[0],sb[0],q), lerp(sa[1],sb[1],q)], lerp(A.z, B.z, zE(p)));
}
// how far along each leg the trail has been walked at time t (0..1)
const legProgress = (i, t) => { const a = holds[i][1], b = holds[i+1][0]; return inOut(clamp((t-a)/(b-a))); };

/* ---------- Polaroids & pins ---------- */
const blank = '<div class="blank" role="img" aria-label="No photo yet"></div>';
const pins = STOPS.map(()=>{const d=document.createElement("div");d.className="pin upcoming";$("#pins").appendChild(d);return d;});
const cards = STOPS.map((s,i)=>{
  const c=document.createElement("figure"); c.className="polaroid";
  c.innerHTML=`<div class="photo">${s.photo?`<img src="${s.photo}" alt="Me with ${s.title}">`:blank}</div>
    <h2><a href="${s.url}" aria-haspopup="dialog"><span>${s.title}</span></a></h2>`;
  c.querySelector("h2 a").addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;   // cmd/ctrl-click still opens the official page in a new tab
    e.preventDefault(); openDrawer(i);
  });
  const img=c.querySelector("img");   // photo missing or not uploaded yet: show the blank square instead of a broken image
  if (img) img.onerror=()=>{ img.parentNode.innerHTML=blank; };
  $("#cards").appendChild(c); return c;
});
/* ---------- Art drawer ---------- */
const drawer = $("#drawer"), esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let drawerFrom = null;
function openDrawer(i){
  const s = STOPS[i], a = ART[s.url] || {};
  $("#dr-title").textContent = a.title || s.title;
  $(".dr-artist").textContent = a.artist ? "by " + a.artist : "";
  const img = $(".dr-photo img"), fig = $(".dr-photo");
  fig.hidden = !a.photo;
  img.onerror = () => { img.removeAttribute("src"); };   // keep the gray frame if the photo can't load
  if (a.photo){ img.src = a.photo; img.alt = a.title || s.title; }
  $(".dr-photo figcaption").textContent = "Photo from bigartloop.org" + (a.credit ? " · " + a.credit : "");
  $(".dr-note").textContent = a.note || ""; $(".dr-note").hidden = !a.note;
  $(".dr-about").textContent = a.about || "";
  const facts = [["Location", a.location], ["Installed", a.installed], ["Partners", a.partners]].filter(f => f[1]);
  const links = (a.links || []).map(([label, href]) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`).join("");
  if (links) facts.push(["Artist links", null, `<span class="dr-links">${links}</span>`]);
  $(".dr-facts").innerHTML = facts.map(([k, v, html]) => `<dt>${k}</dt><dd>${html || esc(v)}</dd>`).join("");
  $(".dr-more").href = s.url;
  $(".dr-body").scrollTop = 0;
  drawerFrom = document.activeElement;
  document.documentElement.classList.add("drawer-open");
  drawer.removeAttribute("inert");
  $(".dr-x").focus({preventScroll:true});
}
function closeDrawer(){
  if (!document.documentElement.classList.contains("drawer-open")) return;
  document.documentElement.classList.remove("drawer-open");
  drawer.setAttribute("inert", "");
  if (drawerFrom && drawerFrom.focus) drawerFrom.focus({preventScroll:true});
}
drawer.setAttribute("inert", "");
$(".dr-x").addEventListener("click", closeDrawer);
$(".dr-back").addEventListener("click", closeDrawer);
$("#scrim").addEventListener("click", closeDrawer);
addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
// keep scroll gestures on the backdrop from moving the map underneath (iOS ignores overflow:hidden)
$("#scrim").addEventListener("touchmove", e => e.preventDefault(), {passive:false});
$("#scrim").addEventListener("wheel", e => e.preventDefault(), {passive:false});

function fitTitles(){
  cards.forEach(c=>{
    const a=c.querySelector("h2 a"), h=c.querySelector("h2"), vis=c.style.visibility;
    c.style.visibility="hidden"; let fs=18; h.style.fontSize=fs+"px"; a.style.maxWidth="none";
    while(a.getBoundingClientRect().width>h.clientWidth && fs>13){fs-=0.5;h.style.fontSize=fs+"px";}
    a.style.maxWidth=""; c.style.visibility=vis;
  });
}

/* ---------- Map ---------- */
if (!document.createElement("canvas").getContext("webgl2") && !document.createElement("canvas").getContext("webgl")) showNotice("This browser can't draw the map (WebGL is off or unavailable).");
const map = new maplibregl.Map({
  container:"map", style:MAP_STYLE, interactive:false,
  attributionControl:{compact:true}, fadeDuration:150,
  center:unmerc(SF_C), zoom:Z0()
});

function quietStyle(){
  const set=(id,prop,val,kind="paint")=>{ if(map.getLayer(id)) (kind==="paint"?map.setPaintProperty:map.setLayoutProperty).call(map,id,prop,val); };
  set("background","background-color","#F3F4EF");
  set("water","fill-color","#C5D6DB");
  set("park","fill-color","#D9E5CF");
  // hide clutter: road names, shields, airports, countries, states
  map.getStyle().layers.forEach(l=>{
    if (/highway-name|shield|airport|label_country|label_state|waterway_line_label/.test(l.id)) set(l.id,"visibility","none","layout");
  });
  // Place names: the map still places them (so they don't collide), but draws them invisibly.
  // updateLabels() redraws them as page text in Bricolage Grotesque.
  LABEL_LAYERS.forEach(id=>{
    set(id,"text-transform","none","layout");
    set(id,"text-size",["interpolate",["linear"],["zoom"],11,11,15,13],"layout");
    set(id,"text-opacity",0); set(id,"icon-opacity",0);
  });
  // San Francisco gets its own darker label (see updateLabels)
  if (map.getLayer("label_city"))
    map.setFilter("label_city",["all",["==",["get","class"],"city"],["!=",["get","capital"],2],["!=",["get","name"],"San Francisco"]]);
  set("water_name_line_label","visibility","none","layout");

  map.addSource("trail",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"trail",type:"line",source:"trail",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#9EA5AC","line-width":3.5,"line-dasharray":[1.4,2.4]}});
}

/* ---------- Map labels as page text ---------- */
const LABEL_LAYERS = ["label_other","label_village","label_town","label_city","water_name_point_label"];
const zInterp = (z, stops) => {   // like MapLibre's ["interpolate",["linear"],["zoom"],...]
  if (z <= stops[0][0]) return stops[0][1];
  for (let i=1;i<stops.length;i++) if (z <= stops[i][0]){ const [z0,v0]=stops[i-1],[z1,v1]=stops[i]; return v0+(v1-v0)*(z-z0)/(z1-z0); }
  return stops[stops.length-1][1];
};
const labelEls = new Map();
const sfEl = Object.assign(document.createElement("div"), {className:"lbl sf", textContent:"San Francisco"});
$("#labels").appendChild(sfEl);
let placed = [], lastQuery = 0;
function updateLabels(){
  const z = map.getZoom(), now = performance.now();
  // ask the map which names it placed (after collisions) a few times a second
  if (now-lastQuery > 150){
    lastQuery = now; const seen = new Set();
    placed = map.queryRenderedFeatures({layers:LABEL_LAYERS.filter(id=>map.getLayer(id))})
      .filter(f => f.geometry.type==="Point")
      .map(f => ({name:f.properties["name:latin"]||f.properties.name, ll:f.geometry.coordinates, water:f.layer.id.startsWith("water")}))
      .filter(l => l.name && l.name!=="San Francisco" && !seen.has(l.name) && seen.add(l.name));
  }
  const sp = map.project(SF_LABEL_AT), sx = sp.x, sy = sp.y, sfSize = zInterp(z,[[10,20],[13,26],[16,30]]);
  sfEl.style.fontSize = sfSize+"px";
  sfEl.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%)`;
  const sfHalfW = sfSize*3.6, size = zInterp(z,[[11,11],[15,13]]), keep = new Set();
  placed.forEach(l=>{
    const {x,y} = map.project(l.ll);
    if (Math.abs(x-sx) < sfHalfW+20 && Math.abs(y-sy) < sfSize) return;   // don't crowd the San Francisco label
    let el = labelEls.get(l.name);
    if (!el){ el = document.createElement("div"); el.className = "lbl"+(l.water?" water":""); el.textContent = l.name; $("#labels").appendChild(el); labelEls.set(l.name, el); }
    el.style.fontSize = size+"px";
    el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
    keep.add(l.name);
  });
  labelEls.forEach((el,name)=>{ if (!keep.has(name)){ el.remove(); labelEls.delete(name); } });
}

/* ---------- Render loop ---------- */
let unit=H, lastW=W;
function layout(){
  W=innerWidth; H=innerHeight;
  if (W!==lastW || !$("#track").style.height){ unit=H; lastW=W; $("#track").style.height=((LOOP+2)*unit)+"px"; }
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";   // always open on the overview
scrollTo(0, 0);
let cur = 0, lastTrail = "", lastFade = 1;

function render(t){
  const cam = camera(t);
  map.jumpTo({center:unmerc(cam.c), zoom:cam.z});

  // trail: walk each leg of the route progressively, in step with the camera
  let key = "";
  const feats = LEGS.map((leg,i)=>{
    const q = legProgress(i, t);
    if (q <= 0) return null;
    if (q >= 1){ key += "F"; return {type:"Feature",properties:{},geometry:{type:"LineString",coordinates:leg.lngLat}}; }
    const {k, pt} = along(leg, q); key += i+":"+Math.round(q*400)+",";
    return {type:"Feature",properties:{},geometry:{type:"LineString",coordinates:leg.lngLat.slice(0,k).concat([unmerc(pt).toArray()])}};
  }).filter(Boolean);
  if (key!==lastTrail && map.getSource("trail")){ map.getSource("trail").setData({type:"FeatureCollection",features:feats}); lastTrail=key; }
  const fade = Math.round((1 - clamp((t-RESET)/0.45))*50)/50;
  if (fade!==lastFade && map.getLayer("trail")){ map.setPaintProperty("trail","line-opacity",fade); lastFade=fade; }

  let active=-1;
  STOPS.forEach((s,i)=>{
    const [sx,sy] = toScreen(P[i], cam);
    pins[i].style.transform=`translate(${sx}px,${sy}px)`;
    const [h0,h1]=holds[i];
    pins[i].classList.toggle("upcoming", t < h0-0.05 || t > RESET+0.25);
    const v = Math.min(clamp((t-(h0-0.18))/0.3), clamp((h1+0.12-t)/0.3));
    const c=cards[i];
    if (v>0.001){
      if (v>0.5) active=i;
      const e = reduce ? 1 : outBack(v);
      c.style.visibility="visible"; c.style.opacity=clamp(v*1.4);
      c.style.transform=`translate(-50%, calc(${sy-22}px - 100%)) rotate(${s.tilt*v}deg) scale(${0.6+0.4*e})`;
    } else { c.style.visibility="hidden"; c.style.opacity=0; }
  });
  $("#count").textContent = active>=0 ? `${active+1} / ${STOPS.length}` : (t>TOTAL-0.5 && t<RESET+0.25 ? `${STOPS.length} pieces` : "");
  $("#hint").style.opacity = clamp(1 - t*3);
  updateLabels();
}
function tick(){
  // past the end of the loop: jump back to the top (same view), so the loop starts over
  if (scrollY >= LOOP*unit){ scrollTo(0, scrollY - LOOP*unit); cur -= LOOP; }
  const target = scrollY/unit;
  cur += (target-cur)*(reduce?1:0.14);
  if (Math.abs(target-cur)<0.0005) cur=target;
  render(cur);
  requestAnimationFrame(tick);
}

layout(); fitTitles();
// keep the map credits folded behind the (i) button; they open only when someone clicks it
const foldAttrib = () => {
  const el = $(".maplibregl-ctrl-attrib.maplibregl-compact-show");
  if (el && !el.dataset.folded){ el.classList.remove("maplibregl-compact-show"); el.removeAttribute("open"); el.dataset.folded = "1"; }
};
map.on("sourcedata", foldAttrib); map.on("styledata", foldAttrib);
map.on("error", e => { const m=e && e.error && e.error.message || ""; if (/style|Failed to fetch|NetworkError/i.test(m) && !map.isStyleLoaded()) showNotice("The map tiles didn't load.", m); });
// restyle as soon as the style is ready (not "load", which waits for every tile)
map.once("style.load", ()=>{ quietStyle(); render(cur); requestAnimationFrame(tick); });
addEventListener("resize", ()=>{ layout(); fitTitles(); map.resize(); });
document.fonts && document.fonts.ready.then(fitTitles);
</script>
</body>
</html>
