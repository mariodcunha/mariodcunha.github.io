<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USA Electoral 2024</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&display=swap">
<style>
/* Layout: race toggle in the top-left corner, NYT-style tally bar, then the square cartogram. Always on white. */
:root{
  --bg:#ffffff; --fg:#121212; --muted:#6b6b6b; --chip:#f2f2f2;
  --rep:#c53f3d; --flip:#8e1f1d; --flip-line:#5c100f; --dem:#3471b4; --dflip:#1e467a; --dflip-line:#112c52;
  --ind:#7aa6d8; --house:#e4e4e4;
  --sans:"Libre Franklin",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:#fff}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:22px}

/* Race toggle with a sliding thumb */
.toggle{position:relative;justify-self:start;display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.toggle .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.16);transition:left .38s var(--ease),width .38s var(--ease)}
.toggle button{position:relative;z-index:1;font:600 13px/1 var(--sans);letter-spacing:.01em;color:var(--muted);background:none;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;transition:color .25s}
.toggle button:hover{color:var(--fg)}
.toggle button[aria-selected="true"]{color:var(--fg)}
.toggle button:focus-visible{outline:2px solid var(--dem);outline-offset:2px}

/* Panels fade between races */
.panel{display:grid;gap:18px;transition:opacity .2s ease,transform .2s ease}
.panel.out{opacity:0;transform:translateY(6px)}
.panel.in{animation:panelIn .38s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.tally{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-variant-numeric:tabular-nums}
.cand{display:grid;gap:2px}
.cand b{font-size:clamp(30px,5.5vw,46px);font-weight:800;line-height:1}
.cand span{font-size:clamp(14px,1.8vw,18px);font-weight:700}
.cand.d b,.cand.d span{color:var(--dem)} .cand.r b,.cand.r span{color:var(--rep)} .cand.r{text-align:right}
.check{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:50%;background:var(--rep);color:#fff;font-size:.72em;margin-right:4px;vertical-align:-.08em;font-style:normal}
.barwrap{display:grid;gap:4px}
.bar{position:relative;height:15px;display:flex}
.bar i{display:block;height:100%;transition:width .8s var(--ease)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--fg);transition:left .8s var(--ease)}
.under{position:relative;min-height:30px;font-size:13px}
.gain{position:absolute;top:0;font-weight:500;transition:opacity .25s}
.gain.d{left:0;color:var(--dem)} .gain.r{right:0;color:var(--rep)}
.need{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:13px;line-height:1.15;transition:left .8s var(--ease)}
.need small{display:block;font-size:9px;font-weight:600;letter-spacing:.06em}
.mapwrap{overflow-x:auto}
svg.map{width:100%;min-width:560px;height:auto;display:block}
svg.map text{font-family:var(--sans);font-size:11px;fill:var(--muted);font-weight:500;dominant-baseline:central;pointer-events:none}
svg.map text.in{fill:#fff;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{width:14px;height:14px}
.legends{display:grid}
.legends>.legend{grid-area:1/1;transition:opacity .35s}
.legends>.legend.off{opacity:0;pointer-events:none;visibility:hidden}

/* House <-> Senate: the states never move. The squares change color and every seat
   pops in (or shrinks away) together, all in the same moment. */
#map-chamber .gray{opacity:0;transition:opacity .45s var(--ease)}
#map-chamber.senate .gray{opacity:1}
#map-chamber .seat{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .45s var(--ease),opacity .45s var(--ease)}
#map-chamber.senate .seat{opacity:1;transform:scale(1);transition:transform .45s cubic-bezier(.34,1.4,.64,1),opacity .2s ease}
.instant,.instant *{transition:none!important;animation:none!important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>

<main>

      <div class="under"><span class="need" style="left:50.19%">270<small>TO WIN</small></span></div>
    </div>
    <div class="mapwrap"><svg class="map" id="map-president" role="img" aria-label="Presidential electoral votes, one square per vote"></svg></div>
    <div class="legend">
      <span><svg viewBox="0 0 14 14"><rect width="14" height="14" fill="var(--flip)"/><path d="M-2 6l8-8M-2 14l16-16M6 16l8-8" stroke="var(--flip-line)" stroke-width="1.6"/></svg>Flipped to Trump from 2020</span>
      <span>Each square is one electoral vote</span>
    </div>
  </section>

  <!-- House and Senate share this panel so the map can morph between them -->
  <section class="panel" id="panel-chamber" role="tabpanel" hidden>
    <div class="tally">
      <div class="cand d"><b id="num-d">215</b><span>Democrats</span></div>
      <div class="cand r"><b id="num-r">220</b><span><i class="check">✓</i>Republicans</span></div>

      <div class="under"><span class="gain" id="gain"></span><span class="need" id="need"></span></div>
    </div>
    <div class="mapwrap"><svg class="map" id="map-chamber" role="img"></svg></div>
    <div class="legends">

        <span><svg viewBox="0 0 14 14"><rect width="14" height="14" fill="var(--dflip)"/><path d="M-2 6l8-8M-2 14l16-16M6 16l8-8" stroke="var(--dflip-line)" stroke-width="1.6"/></svg>Democratic pickup</span>
        <span>Each square is one district</span>
      </div>
      <div class="legend" id="legend-senate">

        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="var(--ind)"/></svg>Independent, caucuses with Democrats</span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="var(--rep)"/></svg>Republican</span>
        <span><svg viewBox="0 0 14 14"><defs><clipPath id="lc"><circle cx="7" cy="7" r="6.5"/></clipPath></defs><g clip-path="url(#lc)"><rect width="14" height="14" fill="var(--flip)"/><path d="M-2 6l8-8M-2 14l16-16M6 16l8-8" stroke="var(--flip-line)" stroke-width="1.6"/></g></svg>Republican pickup</span>
        <span><svg viewBox="0 0 14 14"><rect width="14" height="14" fill="var(--house)"/></svg>House districts</span>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-governors" role="tabpanel" aria-labelledby="tab-governors" hidden></section>
</main>

  const defs=el("defs",{},svg);
  [["hatch-r","--flip","--flip-line"],["hatch-d","--dflip","--dflip-line"]].forEach(([id,bg,ln])=>{
    const p=el("pattern",{id:id+svg.id,width:5,height:5,patternUnits:"userSpaceOnUse",patternTransform:"rotate(-45)"},defs);
    el("rect",{width:5,height:5,fill:`var(${bg})`},p);
    el("line",{x1:0,y1:0,x2:0,y2:5,stroke:`var(${ln})`,"stroke-width":2},p);
  });
}
function square(parent,svg,x,y,dem,flip){
  const fill=flip?`url(#hatch-${dem?"d":"r"}${svg.id})`:dem?"var(--dem)":"var(--rep)";
  el("rect",{x:x*S,y:y*S,width:S,height:S,fill,stroke:"var(--bg)","stroke-width":1},parent);
}
function label(parent,[t,x,y,a,b],cls=""){
  const inside=a===1, anchor=typeof a==="string"?a:b;
  const e=el("text",{x:x*S,y:y*S,class:(inside?"in ":"")+cls,"text-anchor":inside?"middle":(anchor||"middle")},parent);
  e.textContent=t;
}

(function drawPresident(){
  const svg=document.getElementById("map-president"); hatches(svg);
  let W=0,H=0;
  for(const st in STATES) STATES[st].forEach(([r,a,b])=>{for(let c=a;c<=b;c++){
    let dem=DEM.has(st);
    if(st==="ME"&&r===0&&c===45) dem=false;   // ME-2 went Trump
    if(st==="NE"&&r===12&&c===15) dem=true;   // NE-2 went Harris
    square(svg,svg,c,r,dem,!dem&&FLIP.has(st));
    W=Math.max(W,c+1);H=Math.max(H,r+1);
  }});
  PRES_LABELS.forEach(l=>label(svg,l));
  svg.setAttribute("viewBox",`-4 ${-1.4*S} ${W*S+8} ${(H+1.8)*S}`);
})();

// ---------- Chamber map ----------
const chamberSvg=document.getElementById("map-chamber");
const VIEW={};
(function drawChamber(){
  const svg=chamberSvg; hatches(svg);
  const hb=[0,0,0,0]; // minX,minY,maxX,maxY in squares
  const grow=(b,x,y)=>{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x+1);b[3]=Math.max(b[3],y+1)};
  CHAMBER.forEach((st,i)=>{
    const g=el("g",{class:"state"},svg);
    st.c.forEach(([x,y,d,f])=>{square(g,svg,x,y,d,f);grow(hb,x,y)});
    const gray=el("g",{class:"gray"},g);
    st.c.forEach(([x,y])=>el("rect",{x:x*S,y:y*S,width:S,height:S,fill:"var(--house)",stroke:"var(--bg)","stroke-width":1},gray));
    st.o.forEach(([x,y],k)=>{
      const p=st.p[k], fill=st.f===k?`url(#hatch-r${svg.id})`:p==="r"?"var(--rep)":p==="i"?"var(--ind)":"var(--dem)";
      el("circle",{class:"seat",cx:(x+.5)*S,cy:(y+.5)*S,r:S*.43,fill},g);
      grow(hb,x,y);
    });
    label(g,st.h);
  });
  hb[1]-=0.6; // room for the labels above the top row
  // extra room on the right for the labels beside New England
  VIEW.house=VIEW.senate=[hb[0]*S-6,hb[1]*S-8,(hb[2]-hb[0]+2.4)*S+12,(hb[3]-hb[1])*S+16];
})();

const TALLY={
  house:{d:215,r:220,mark:218/435*100,need:"218",needSub:"FOR CONTROL",gain:"+2 net gain",gainSide:"d",label:"House results, one square per district"},
  senate:{d:47,r:53,mark:50,need:"51",needSub:"FOR MAJORITY",gain:"+4 net gain",gainSide:"r",label:"Senate seats after the 2024 election: two circles per state on the gray House map"},
};
let chamberMode=null, vbAnim=0;
function setViewBox(to,animate){
  cancelAnimationFrame(vbAnim);
  if(!animate||reduce){chamberSvg.setAttribute("viewBox",to.join(" "));return}
  const from=(chamberSvg.getAttribute("viewBox")||to.join(" ")).split(" ").map(Number);
  const delay=300,dur=800,t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=now=>{
    const t=Math.min(1,Math.max(0,(now-t0-delay)/dur)), e=ease(t);
    chamberSvg.setAttribute("viewBox",from.map((v,i)=>v+(to[i]-v)*e).join(" "));
    if(t<1) vbAnim=requestAnimationFrame(step);
  };
  vbAnim=requestAnimationFrame(step);
}
function countTo(node,to,animate){
  const from=+node.textContent||0;
  if(!animate||reduce||from===to){node.textContent=to;return}
  const t0=performance.now(),dur=800;
  const step=now=>{const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3);
    node.textContent=Math.round(from+(to-from)*e); if(t<1) requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setChamber(mode,animate){
  const T=TALLY[mode], panel=document.getElementById("panel-chamber");
  if(!animate) panel.classList.add("instant");
  chamberSvg.classList.toggle("senate",mode==="senate");
  chamberSvg.setAttribute("aria-label",T.label);
  setViewBox(VIEW[mode],animate);
  countTo(document.getElementById("num-d"),T.d,animate);
  countTo(document.getElementById("num-r"),T.r,animate);
  const tot=T.d+T.r;
  document.getElementById("bar-d").style.width=T.d/tot*100+"%";
  document.getElementById("bar-r").style.width=T.r/tot*100+"%";
  document.getElementById("mark").style.left=T.mark+"%";
  const need=document.getElementById("need");
  need.style.left=T.mark+"%"; need.innerHTML=`${T.need}<small>${T.needSub}</small>`;
  const gain=document.getElementById("gain");
  const applyGain=()=>{gain.className="gain "+T.gainSide;gain.textContent=T.gain;gain.style.opacity=1};
  if(animate&&!reduce&&chamberMode&&chamberMode!==mode){gain.style.opacity=0;setTimeout(applyGain,250)} else applyGain();
  document.getElementById("legend-house").classList.toggle("off",mode!=="house");
  document.getElementById("legend-senate").classList.toggle("off",mode!=="senate");
  panel.setAttribute("aria-labelledby","tab-"+mode);
  chamberMode=mode;
  if(!animate){void panel.offsetWidth;requestAnimationFrame(()=>panel.classList.remove("instant"))}
}

// ---------- Race toggle ----------
const tabs=[...document.querySelectorAll('.toggle button')];
const thumb=document.querySelector('.toggle .thumb');
const panelOf=r=>document.getElementById("panel-"+(r==="house"||r==="senate"?"chamber":r));
let current=null;
function moveThumb(tab,animate){
  if(!animate) thumb.style.transition="none";
  thumb.style.left=tab.offsetLeft+"px"; thumb.style.width=tab.offsetWidth+"px";
  if(!animate){void thumb.offsetWidth;thumb.style.transition=""}
}
function show(race,animate){
  if(!tabs.some(t=>t.dataset.race===race)) race="president";
  if(race===current) return;
  const tab=tabs.find(t=>t.dataset.race===race);
  tabs.forEach(t=>{const on=t===tab;t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1});
  moveThumb(tab,animate);
  const from=current&&panelOf(current), to=panelOf(race);
  const chamber=race==="house"||race==="senate";
  if(from===to){ if(chamber) setChamber(race,animate); current=race; return }
  if(chamber) setChamber(race,false);
  const reveal=()=>{
    document.querySelectorAll(".panel").forEach(p=>{if(p!==to){p.hidden=true;p.classList.remove("out","in")}});
    to.hidden=false; to.classList.remove("out");
    if(animate&&!reduce){to.classList.remove("in");void to.offsetWidth;to.classList.add("in")}
  };
  if(from&&animate&&!reduce){from.classList.add("out");setTimeout(reveal,200)} else reveal();
  current=race;
}
tabs.forEach((t,i)=>{
  t.addEventListener("click",()=>{show(t.dataset.race,true);history.replaceState(null,"","#"+t.dataset.race)});
  t.addEventListener("keydown",e=>{const d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;
    if(d){const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();n.click()}});
});
addEventListener("resize",()=>{const t=tabs.find(t=>t.dataset.race===current);if(t)moveThumb(t,false)});
document.fonts?.ready.then(()=>{const t=tabs.find(t=>t.dataset.race===current);if(t)moveThumb(t,false)});
show(location.hash.slice(1),false);
</script>
